name: Test de connexion (lecture seule)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-connexion.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Base de données (lecture seule)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Secret SUPABASE_DB_URL absent"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -A -t <<'SQL'
          set default_transaction_read_only = on;
          select 'version: ' || version();
          select 'schemas: ' || string_agg(nspname, ', ' order by nspname)
            from pg_namespace where nspname not like 'pg_%' and nspname <> 'information_schema';
          select 'schema planning existe deja: ' || exists(select 1 from pg_namespace where nspname = 'planning');
          select 'tables public: ' || count(*) from information_schema.tables where table_schema = 'public';
          SQL

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Jeton Supabase (liste des Edge Functions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN absent"; exit 1; }
          supabase functions list --project-ref oldkmapumqnibdcniecd
